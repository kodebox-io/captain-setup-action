name: "Setup Python"

inputs:
  install-zuzu-dependencies:
    default: "false"

runs:
  using: "composite"
  steps:
    # 버전은 체크아웃한 저장소의 .python-version 을 따른다. 이 액션은 모든 브랜치가 @master 로
    # 함께 쓰므로, 파일이 없는 브랜치(전환 전 브랜치·production)는 그동안 쓰던 3.11 로 돈다.
    - name: Resolve Python version
      id: python-version
      shell: bash
      run: |
        if [ -f .python-version ]; then
          version=$(head -n1 .python-version | tr -d '[:space:]')
        else
          version="3.11"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Python ${{ steps.python-version.outputs.version }}
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.python-version.outputs.version }}
        architecture: "x64"

    - name: Setup uv
      shell: bash
      run: |
        pip install uv
        python --version ; uv --version

    - name: Cache .venv
      if: inputs.install-zuzu-dependencies == 'true'
      id: cache-venv
      uses: actions/cache@v4
      with:
        path: ./.venv
        # 다른 Python 으로 만든 .venv 를 복원하지 않게, 실제로 설치된 버전을 패치까지 키에 넣는다.
        # .venv 는 만든 인터프리터 경로(/opt/hostedtoolcache/Python/3.12.15/...)를 가리킨다.
        # 러너 이미지가 패치 버전을 올리면 그 경로가 사라져 uv 가 복원한 .venv 를 버리고 다시 만든다.
        # 키에 "3.12" 까지만 두면 키는 그대로 맞아 다시 만든 .venv 가 저장되지 않고, uv.lock 이 바뀔
        # 때까지 매 잡이 깨진 캐시를 받고 다시 만든다. restore-keys 도 같은 이유로 패치까지 좁힌다.
        key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('./uv.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-

    # .venv 없이 `uv run` 하면 uv 가 venv 를 만들고 프로젝트 전체를 설치하므로, venv 를 쓰는 잡에서만 확인한다.
    - name: Check .venv
      if: inputs.install-zuzu-dependencies == 'true'
      id: check-venv
      shell: bash
      run: |
        if (uv run python3 -c "import django"); then
          echo "result=true" >> $GITHUB_OUTPUT
        else
          echo "result=false" >> $GITHUB_OUTPUT
          # 일주일이 지난 PR은 GitHub에 의해 .venv 캐시가 삭제되므로 재설치가 필요하다.
          # https://docs.github.com/en/actions/advanced-guides/caching-dependencies-to-speed-up-workflows#usage-limits-and-eviction-policy
          rm -rf .venv
        fi

    - name: zz deps_django
      if: inputs.install-zuzu-dependencies == 'true'
      shell: bash
      run: |
        ./zz deps_django
